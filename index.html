<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Interior Poker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00b87c;
            --bg-gray: #dfdfdf;
            --text-dark: #000;
            --border-light: #e0e0e0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            width: 130px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 22px;
            margin: 0 0 20px 0;
            font-weight: 800;
            color: #000;
        }

        /* Card Principal */
        .main-card {
            border: 1px solid var(--border-light);
            border-top: 5px solid var(--primary-green);
            border-radius: 6px;
            padding: 20px 25px;
            margin-bottom: 20px;
            background: #fff;
            text-align: left;
        }

        .status-badge {
            color: var(--primary-green);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: block;
        }

        .phone-number {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #000;
            letter-spacing: -0.5px;
        }

        .description {
            color: #333;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-whatsapp {
            background-color: var(--primary-green);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            display: block;
            text-align: center;
            font-weight: bold;
            transition: opacity 0.3s;
            font-size: 14px;
        }
        
        .btn-whatsapp:hover {
            opacity: 0.9;
        }

        /* Cards de Reserva */
        .reserve-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            text-align: left;
            text-decoration: none;
            color: inherit;
        }
        
        a.reserve-card:hover {
            opacity: 0.9;
            background-color: #fafafa;
        }

        .reserve-info {
            display: flex;
            align-items: center;
        }

        .icon-wa-bg {
            width: 45px;
            height: 45px;
            background-color: #e6f7ec;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        
        .icon-wa-bg svg {
            width: 22px;
            fill: var(--primary-green);
        }

        .reserve-card.bg-inactive .icon-wa-bg {
            background-color: #d8d8d8;
        }
        
        .reserve-card.bg-inactive .icon-wa-bg svg {
            fill: #666;
        }

        .reserve-text {
            display: flex;
            flex-direction: column;
        }

        .reserve-text b {
            font-size: 17px;
            color: #000;
            margin-bottom: 2px;
        }
        
        .reserve-text span {
            font-size: 15px;
            color: #222;
        }

        .status-label {
            font-weight: bold;
            font-size: 14px;
        }

        .active { color: var(--primary-green); }
        .inactive { color: #666; font-weight: bold; }
        .bg-inactive { background-color: #e6e6e6; border-color: #d1d1d1; cursor: not-allowed; }

        /* Rodapé Informativo */
        .info-box {
            background-color: #fffaf0;
            border: 1px solid transparent; /* no border, just background */
            padding: 18px 25px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 20px;
            line-height: 1.5;
            color: #000;
        }
        
        .info-box strong {
            color: #e8a514;
        }

        .loading-state {
            padding: 40px 0;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Interior Poker" class="logo">
    
    <h2>Atendimento Interior Poker</h2>

    <div id="numeros-container">
        <div class="loading-state">
            Carregando números...
        </div>
    </div>

    <div class="info-box">
        <strong>⚠️ Dica importante:</strong><br>
        Salve nossos números oficiais para evitar perfis fakes. Nossa
        equipe nunca entra em contato primeiro para pedir
        transferências.
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://vqvrgpyktfjdqtbnkkfy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdnJncHlrdGZqZHF0Ym5ra2Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODUxNzgsImV4cCI6MjA5MDQ2MTE3OH0.7V1_FcIPSyM8GhtdWWdWchn1qGPANgJrxjuDjQQCPQI';

    // SVG do WhatsApp (como no print)
    const waIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width: 24px; height: 24px; padding-bottom: 2px;">
<path d="M256 0C114.6 0 0 114.6 0 256c0 45 11.5 87 31.9 123.6L4.5 486.2l110.1-27.1C150.1 475.5 192.3 486.5 256 486.5 397.4 486.5 512 371.9 512 230.5S397.4 0 256 0zM388.9 335.5c-6.1 17.2-31.9 33.1-43.9 36.1-8.5 2.1-19.6 4-53.7-9.5-40.8-16.1-66.9-56-69-58.8-2.1-2.8-16.5-21.9-16.5-41.8 0-19.9 10.3-29.6 14.1-33.8 3.8-4.2 8.2-5.3 11-5.3 2.8 0 5.6 0 8.1 .1 2.5 .1 6.1-.9 9.6 7.4 3.5 8.5 11.9 29.2 13 31.3 1.1 2.1 1.8 4.6 .4 6.7s-2.1 3.5-4.2 5.6c-2.1 2.1-4.4 4.5-6.2 6.3-2 1.9-4.1 4-1.8 8.1 2.4 4 10.5 17.2 22.4 27.8 15.3 13.7 28.3 17.9 32.3 19.3 4 1.4 6.4 1.2 8.8-1.5 2.4-2.8 10.2-11.9 12.9-16s5.4-3.5 9-2.1c3.5 1.4 22.5 10.6 26.4 12.5 3.9 1.9 6.5 2.8 7.5 4.4 .9 1.5 .9 8.9-1.9 19.9z"/>
<path fill="currentColor" d="M388.9 335.5c-6.1 17.2-31.9 33.1-43.9 36.1-8.5 2.1-19.6 4-53.7-9.5C250.5 346 224.4 306 222.3 303.3c-2.1-2.8-16.5-21.9-16.5-41.8 0-19.9 10.3-29.6 14.1-33.8 3.8-4.2 8.2-5.3 11-5.3 2.8 0 5.6 0 8.1 .1 2.5 .1 6.1-.9 9.6 7.4 3.5 8.5 11.9 29.2 13 31.3 1.1 2.1 1.8 4.6 .4 6.7s-2.1 3.5-4.2 5.6c-2.1 2.1-4.4 4.5-6.2 6.3-2 1.9-4.1 4-1.8 8.1 2.4 4 10.5 17.2 22.4 27.8 15.3 13.7 28.3 17.9 32.3 19.3 4 1.4 6.4 1.2 8.8-1.5 2.4-2.8 10.2-11.9 12.9-16s5.4-3.5 9-2.1c3.5 1.4 22.5 10.6 26.4 12.5 3.9 1.9 6.5 2.8 7.5 4.4 .9 1.5 .9 8.9-1.9 19.9z"/>
</svg>`;

    async function carregarNumeros() {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/whatsapp_numeros?order=ordem.asc`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            let numeros = await res.json();
            
            numeros.sort((a, b) => {
                if (a.principal && !b.principal) return -1;
                if (!a.principal && b.principal) return 1;
                if (a.ativo && !b.ativo) return -1;
                if (!a.ativo && b.ativo) return 1;
                return a.ordem - b.ordem;
            });

            renderizar(numeros);
        } catch (err) {
            document.getElementById('numeros-container').innerHTML =
                '<p style="color:#ff6b6b;font-size:0.85rem;padding:20px 0;">Erro ao carregar. Tente novamente.</p>';
        }
    }

    function renderizar(numeros) {
        const container = document.getElementById('numeros-container');
        container.innerHTML = '';

        numeros.forEach(n => {
            if (n.principal && n.ativo) {
                // Principal
                const html = `
                <div class="main-card">
                    <span class="status-badge">NÚMERO PRINCIPAL ATIVO</span>
                    <div class="phone-number">${n.telefone}</div>
                    <p class="description">Utilize este número para depósitos e saques rápidos.</p>
                    <a href="https://wa.me/${n.telefone_link}" class="btn-whatsapp" target="_blank">Chamar no Whatsapp</a>
                </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
                
            } else if (n.ativo) {
                // Reserva ativo
                const html = `
                <a href="https://wa.me/${n.telefone_link}" class="reserve-card" target="_blank">
                    <div class="reserve-info">
                        <div class="icon-wa-bg">
                            ${waIconSvg}
                        </div>
                        <div class="reserve-text">
                            <b>${n.label}</b>
                            <span>${n.telefone}</span>
                        </div>
                    </div>
                    <span class="status-label active">Ativo</span>
                </a>
                `;
                container.insertAdjacentHTML('beforeend', html);
                
            } else {
                // Reserva inativo
                const html = `
                <div class="reserve-card bg-inactive">
                    <div class="reserve-info">
                        <div class="icon-wa-bg" style="background-color: #d1dad4;">
                            ${waIconSvg.replace('fill: var(--primary-green)', 'fill: #666;')}
                        </div>
                        <div class="reserve-text">
                            <b style="color:#000;">${n.label}</b>
                            <span style="color:#222;">${n.telefone}</span>
                        </div>
                    </div>
                    <span class="status-label inactive">Inativo</span>
                </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            }
        });
    }

    carregarNumeros();
</script>

</body>
</html>
